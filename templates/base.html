<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Song Instagram{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 935px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navigation */
        .navbar {
            background: linear-gradient(90deg, #000000 0%, #1a1a1a 50%, #000000 100%);
            border-bottom: 1px solid #333;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 935px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: #FFD700;
            transform: translateY(-2px);
        }

        .nav-links a.active {
            color: #FFD700;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #FFD700;
            font-weight: 500;
        }

        /* Flash Messages */
        .flash-messages {
            padding: 1rem 0;
        }

        .flash {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 12px;
            font-weight: 500;
            text-align: center;
            animation: slideDown 0.3s ease;
        }

        .flash.success {
            background: linear-gradient(135deg, #28a745, #20c997);
            border: 1px solid #20c997;
        }

        .flash.error {
            background: linear-gradient(135deg, #dc3545, #e74c3c);
            border: 1px solid #e74c3c;
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #000000;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #FFA500, #FFD700);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #333, #555);
            color: #ffffff;
            border: 1px solid #666;
        }

        .btn-secondary:hover {
            background: linear-gradient(45deg, #555, #333);
            border-color: #FFD700;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #FFD700;
            color: #FFD700;
        }

        .btn-outline:hover {
            background: #FFD700;
            color: #000000;
            transform: translateY(-2px);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #FFD700;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #333;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #FFD700;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        .form-control::placeholder {
            color: #999;
        }

        /* Cards */
        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid #333;
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.1);
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            border-top-color: #FFD700;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .nav-container {
                padding: 0 1rem;
            }

            .nav-links {
                gap: 1rem;
            }

            .nav-links a {
                font-size: 1.2rem;
            }

            .container {
                padding: 0 1rem;
            }

            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    {% if session.username %}
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('feed') }}" class="logo">
                <i class="fas fa-music"></i> SongGram
            </a>
            
            <div class="nav-links">
                <a href="{{ url_for('feed') }}" class="{% if request.endpoint == 'feed' %}active{% endif %}">
                    <i class="fas fa-home"></i>
                </a>
                <a href="{{ url_for('create_post') }}" class="{% if request.endpoint == 'create_post' %}active{% endif %}">
                    <i class="fas fa-plus"></i>
                </a>
                <a href="{{ url_for('friends') }}" class="{% if request.endpoint == 'friends' %}active{% endif %}">
                    <i class="fas fa-users"></i>
                </a>
                <a href="{{ url_for('profile') }}" class="{% if request.endpoint == 'profile' %}active{% endif %}">
                    <i class="fas fa-user"></i>
                </a>
            </div>
            
            <div class="user-info">
                <span>@{{ session.username }}</span>
                <a href="{{ url_for('logout') }}" style="color: #dc3545; margin-left: 1rem;">
                    <i class="fas fa-sign-out-alt"></i>
                </a>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Page Content -->
        {% block content %}{% endblock %}
    </div>

    <script>
        // Auto-hide flash messages
        setTimeout(() => {
            document.querySelectorAll('.flash').forEach(flash => {
                flash.style.opacity = '0';
                flash.style.transform = 'translateY(-20px)';
                setTimeout(() => flash.remove(), 300);
            });
        }, 5000);
    </script>
</body>
</html>
