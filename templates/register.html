{% extends "base.html" %}

{% block title %}Register - Song Instagram{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 450px; width: 100%; text-align: center;">
        <div style="margin-bottom: 2rem;">
            <h1 class="logo" style="font-size: 2.5rem; margin-bottom: 0.5rem;">
                <i class="fas fa-music"></i> Join SongGram
            </h1>
            <p style="color: #999; font-size: 1rem;">Create your account and start sharing music</p>
        </div>

        <form method="POST" style="text-align: left;" id="registerForm">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user" style="color: #FFD700; margin-right: 0.5rem;"></i>
                    Username
                </label>
                <input type="text" id="username" name="username" class="form-control" 
                       placeholder="Choose a unique username" required minlength="3" maxlength="20">
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock" style="color: #FFD700; margin-right: 0.5rem;"></i>
                    Password
                </label>
                <input type="password" id="password" name="password" class="form-control" 
                       placeholder="Create a strong password" required minlength="6">
                <div style="margin-top: 0.5rem; font-size: 0.85rem; color: #999;">
                    Password must be at least 6 characters long
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">
                    <i class="fas fa-lock" style="color: #FFD700; margin-right: 0.5rem;"></i>
                    Confirm Password
                </label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" 
                       placeholder="Confirm your password" required>
                <div id="passwordMismatch" style="color: #dc3545; font-size: 0.85rem; margin-top: 0.5rem; display: none;">
                    Passwords do not match
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1.5rem;">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div style="text-align: center; padding-top: 1rem; border-top: 1px solid #333;">
            <p style="color: #999; margin-bottom: 1rem;">Already have an account?</p>
            <a href="{{ url_for('login') }}" class="btn btn-outline">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </a>
        </div>
    </div>
</div>

<style>
    body {
        background: linear-gradient(135deg, #000000 0%, #1a1a1a 30%, #2d2d2d 70%, #000000 100%);
        background-attachment: fixed;
    }

    .card {
        backdrop-filter: blur(20px);
        border: 2px solid rgba(255, 215, 0, 0.2);
        position: relative;
        overflow: hidden;
        animation: fadeInUp 0.6s ease;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.1), transparent);
        transition: left 0.5s;
    }

    .card:hover::before {
        left: 100%;
    }

    .form-control {
        transition: all 0.3s ease;
    }

    .form-control:focus {
        transform: scale(1.02);
        border-color: #FFD700;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    }

    .form-control.error {
        border-color: #dc3545;
        background: rgba(220, 53, 69, 0.1);
    }

    .form-control.success {
        border-color: #28a745;
        background: rgba(40, 167, 69, 0.1);
    }

    .btn {
        position: relative;
        overflow: hidden;
    }

    .btn::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.3s, height 0.3s;
    }

    .btn:hover::before {
        width: 300px;
        height: 300px;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('registerForm');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirm_password');
    const passwordMismatch = document.getElementById('passwordMismatch');

    function validatePasswords() {
        if (confirmPassword.value === '') {
            passwordMismatch.style.display = 'none';
            confirmPassword.classList.remove('error', 'success');
            return;
        }

        if (password.value !== confirmPassword.value) {
            passwordMismatch.style.display = 'block';
            confirmPassword.classList.add('error');
            confirmPassword.classList.remove('success');
        } else {
            passwordMismatch.style.display = 'none';
            confirmPassword.classList.add('success');
            confirmPassword.classList.remove('error');
        }
    }

    password.addEventListener('input', validatePasswords);
    confirmPassword.addEventListener('input', validatePasswords);

    form.addEventListener('submit', function(e) {
        if (password.value !== confirmPassword.value) {
            e.preventDefault();
            validatePasswords();
            confirmPassword.focus();
        }
    });

    // Real-time username validation
    const username = document.getElementById('username');
    username.addEventListener('input', function() {
        if (this.value.length >= 3) {
            this.classList.add('success');
            this.classList.remove('error');
        } else if (this.value.length > 0) {
            this.classList.add('error');
            this.classList.remove('success');
        } else {
            this.classList.remove('error', 'success');
        }
    });
});
</script>
{% endblock %}
